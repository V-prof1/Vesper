name: VESPER • Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'assets/**'
      - 'index.html'
      - 'tools/validate_assets.py'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'

jobs:
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate packaged sprites
        run: python3 tools/validate_assets.py
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android 35
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build offline APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Upload Vesper APK
        uses: actions/upload-artifact@v4
        with:
          name: VESPER-ABISMO-PIXEL-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
