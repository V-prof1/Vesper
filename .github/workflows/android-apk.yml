name: VESPER • Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'assets/**'
      - 'index.html'
      - 'tools/**'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'

jobs:
  android:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Pillow
        run: python -m pip install Pillow==11.3.0
      - name: Generate distinct bodies and 104-frame moris
        run: python tools/unique_sprites.py
      - name: Apply advanced AI, items and map improvements
        run: python tools/overhaul_patch.py
      - name: Package updated offline game
        run: python tools/integrate_game.py
      - name: Apply Vesper 3.0 killer rework, stealth and ten maps
        run: python tools/apply_rework_v3.py
      - name: Refresh sprite previews
        run: |
          sed -i 's/80 QUADROS CADA/104 QUADROS CADA/g' tools/make_previews.py
          python tools/make_previews.py
      - name: Validate packaged sprites
        run: python tools/validate_assets.py
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # GitHub runner already includes Android SDK tools; avoid deprecated setup-android.
      - name: Install Android 35
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager -print -quit)"
          fi
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build Android APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Verify Android APK
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -n 1
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload VESPER APK
        uses: actions/upload-artifact@v4
        with:
          name: VESPER-ABISMO-PRO-BOTS-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      # Publish the generated game and sprite atlases to this portfolio as well.
      # A push performed using GITHUB_TOKEN does not recursively trigger Actions.
      - name: Synchronize generated game assets
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets app/src/main/assets index.html JOGAR_NO_PC.html PREVIA_*.png
          if ! git diff --cached --quiet; then
            git commit -m "build: regenerate 14 distinct killers and 104-frame moris [skip ci]"
            git push
          fi
