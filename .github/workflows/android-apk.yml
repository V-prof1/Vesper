name: VESPER • Android APK

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - 'app/**'
      - 'assets/**'
      - 'index.html'
      - 'tools/validate_assets.py'
      - 'build.gradle'
      - 'settings.gradle'
      - 'gradle.properties'
      - '.github/workflows/android-apk.yml'

jobs:
  android:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Validate packaged sprites
        run: python3 tools/validate_assets.py
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # Avoid setup-android@v3: it tries to install the removed legacy SDK package 'tools'.
      # GitHub's Ubuntu runner already includes the command-line Android SDK manager.
      - name: Install Android 35
        shell: bash
        run: |
          echo "ANDROID_HOME=${ANDROID_HOME:-unset}"
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then
            SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager -print -quit)"
          fi
          if [[ -z "$SDKMANAGER" ]]; then
            echo "Android SDK manager not available" >&2
            exit 1
          fi
          "$SDKMANAGER" --version
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build offline APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon
      - name: Verify Android APK
        shell: bash
        run: |
          test -s app/build/outputs/apk/debug/app-debug.apk
          unzip -t app/build/outputs/apk/debug/app-debug.apk | tail -n 1
          sha256sum app/build/outputs/apk/debug/app-debug.apk
      - name: Upload Vesper APK
        uses: actions/upload-artifact@v4
        with:
          name: VESPER-ABISMO-PIXEL-APK
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
