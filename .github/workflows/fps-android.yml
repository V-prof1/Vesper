name: VESPER FIRST BLOOD • APK 3D

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'first-person/**'
      - '.github/workflows/fps-android.yml'

jobs:
  android-fps:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Android SDK 35
        shell: bash
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [[ -z "$SDKMANAGER" ]]; then SDKMANAGER="$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}" -type f -name sdkmanager -print -quit)"; fi
          test -n "$SDKMANAGER"
          "$SDKMANAGER" --install 'platforms;android-35' 'build-tools;35.0.0'
      - name: Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build FPS APK
        working-directory: first-person/android
        run: gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Verify APK
        run: |
          test -s first-person/android/app/build/outputs/apk/debug/app-debug.apk
          unzip -t first-person/android/app/build/outputs/apk/debug/app-debug.apk | tail -n 1
      - name: Upload FPS APK
        uses: actions/upload-artifact@v4
        with:
          name: VESPER-FIRST-BLOOD-3D-APK
          path: first-person/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
