plugins {
    id 'com.android.application'
}

android {
    namespace 'com.vesper.firstblood'
    compileSdk 35

    defaultConfig {
        applicationId 'com.vesper.firstblood'
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName '0.1.0-fps'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    packaging {
        resources {
            excludes += ['/META-INF/{AL2.0,LGPL2.1}']
        }
    }
}
